# version omitted deliberately — matches the pranajiva-backend/storefront compose files already
# running in production; modern Docker Compose treats the top-level `version:` key as obsolete and
# warns about it.

services:
  crossfriend-ops:
    image: pranajiva-ops:latest
    container_name: crossfriend-ops
    ports:
      - "4000:4000"
    environment:
      # Every one of these is read directly from process.env at runtime (grep-verified against
      # src/) — nothing here is baked into the image at build time. Missing one of these here is
      # exactly the bug that silently broke the AI Cake Studio backend twice this session (a var
      # present in .env but never forwarded into the container) — don't repeat that here.
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: ${DATABASE_URL}
      SESSION_SECRET: ${SESSION_SECRET}
      GOOGLE_PLACES_API_KEY: ${GOOGLE_PLACES_API_KEY}
      S3_URL: ${S3_URL}
      S3_BUCKET: ${S3_BUCKET}
      S3_REGION: ${S3_REGION}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
    restart: unless-stopped
    healthcheck:
      # 127.0.0.1, not localhost — see the Dockerfile's HEALTHCHECK comment for why.
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:4000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
